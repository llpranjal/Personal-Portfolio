<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6647"/>
      <stop offset=".28" stop-color="#c6a97b"/>
      <stop offset=".5" stop-color="#a88f6d"/>
      <stop offset=".72" stop-color="#d0b488"/>
      <stop offset="1" stop-color="#7e6949"/>
    </linearGradient>
    <linearGradient id="bhi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".56" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="brush">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.9" numOctaves="2" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" filter="url(#brush)" opacity=".2" style="mix-blend-mode:overlay"/>
  <rect width="800" height="1000" fill="url(#bhi)"/>
  <rect x="1" y="1" width="798" height="998" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="2"/>
</svg>
