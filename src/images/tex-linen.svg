<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe9df"/>
      <stop offset="1" stop-color="#d4cbbc"/>
    </linearGradient>
    <pattern id="weave" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 0H9" stroke="#c4b8a5" stroke-opacity=".55" stroke-width="1.1"/>
      <path d="M0 0V9" stroke="#c9beac" stroke-opacity=".4" stroke-width="1.1"/>
      <path d="M0 4.5H9" stroke="#efe9df" stroke-opacity=".5" stroke-width="1"/>
    </pattern>
    <radialGradient id="nv" cx=".5" cy=".42" r=".85">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5c503f" stop-opacity=".16"/>
    </radialGradient>
    <filter id="ngrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#ng)"/>
  <rect width="800" height="1000" fill="url(#weave)"/>
  <rect width="800" height="1000" filter="url(#ngrain)" opacity=".12" style="mix-blend-mode:multiply"/>
  <rect width="800" height="1000" fill="url(#nv)"/>
</svg>
