<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c4638"/>
      <stop offset=".5" stop-color="#43342b"/>
      <stop offset="1" stop-color="#2f251d"/>
    </linearGradient>
    <radialGradient id="ls" cx=".32" cy=".26" r="1">
      <stop offset="0" stop-color="#c9ab80" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#c9ab80" stop-opacity="0"/>
    </radialGradient>
    <filter id="lgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="lwarp">
      <feTurbulence type="turbulence" baseFrequency="0.014 0.02" numOctaves="2" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="28"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="#2f251d"/>
  <g filter="url(#lwarp)">
    <rect x="-40" y="-40" width="880" height="1080" fill="url(#lg)"/>
    <rect x="-40" y="-40" width="880" height="1080" fill="url(#ls)"/>
  </g>
  <rect width="800" height="1000" filter="url(#lgrain)" opacity=".22" style="mix-blend-mode:overlay"/>
  <rect x="1" y="1" width="798" height="998" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2"/>
</svg>
